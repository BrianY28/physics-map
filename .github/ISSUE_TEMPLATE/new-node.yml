name: New node
description: Propose a new node for the map, with a draft note, concepts, and sources.
title: "[New node] "
labels: ["new-node"]
body:
  - type: markdown
    attributes:
      value: |
        A node is one topic, one Markdown file. Keep it narrow: if you can split it into two nodes without losing anything, it is probably two nodes.

  - type: input
    id: proposed-title
    attributes:
      label: Proposed title
      description: Seven words at most. This becomes the `# Title` line and the file name.
      placeholder: Path integral formulation
    validations:
      required: true
      max_length: 60

  - type: dropdown
    id: branch
    attributes:
      label: Branch
      description: The folder the node belongs in.
      options:
        - 01-newtonian-mechanics
        - 02-electromagnetism-optics
        - 03-thermodynamics-statmech
        - 04-quantum-mechanics-qft
        - 05-relativity-gravitation
        - 06-nuclear-particle
        - 07-amo-physics
        - 08-condensed-matter
        - 09-astrophysics-cosmology
        - 10-fluids-plasmas-complexity
        - 11-open-frontier
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the map
      description: What this node connects to, and why the map is incomplete without it.
    validations:
      required: true

  - type: textarea
    id: draft-note
    attributes:
      label: Draft note
      description: One or two sentences, plain language, saying what the idea is and why it mattered.
      placeholder: Reformulates quantum mechanics as a sum over histories, making the classical limit and perturbation theory visible in one construction.
    validations:
      required: false

  - type: textarea
    id: concepts
    attributes:
      label: Concepts
      description: Two to five lines, one concept per line. These become the `## Concepts` list.
      placeholder: |-
        Action and the classical limit
        Sum over paths and interference
        Feynman diagrams as a calculational scheme
        Relation to the operator formulation
    validations:
      required: false

  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Full citations - authors, title, journal or publisher, year, and DOI or stable URL. At least one.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched the map and this topic is not already covered
          required: true
